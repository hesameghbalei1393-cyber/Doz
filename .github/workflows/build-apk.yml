
name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check signing password
        shell: bash
        run: |
          test -n "$SIGNING_PASSWORD" || {
            echo "SIGNING_PASSWORD secret is missing"
            exit 1
          }

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Initialize Android
        run: |
          npx cap init Doz com.doz.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set Android Launcher Icon
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("icon-512.png")
          if not source.is_file():
              raise SystemExit("icon-512.png missing from repository root")

          img = Image.open(source).convert("RGBA")
          res = Path("android/app/src/main/res")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(folder / "ic_launcher.png")
              resized.save(folder / "ic_launcher_round.png")

          # Remove adaptive icon XML so Android uses the PNG launcher icon.
          adaptive = res / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  p = adaptive / name
                  if p.exists():
                      p.unlink()

          print("Launcher icons generated from icon-512.png")
          PY

      - name: Configure Release Signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Insert signing configuration inside the android block.
          android_match = re.search(r'\bandroid\s*\{', s)
          if not android_match:
              raise SystemExit("Android Gradle block not found")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/release.jks")
                      storePassword System.getenv("SIGNING_PASSWORD")
                      keyAlias "release"
                      keyPassword System.getenv("SIGNING_PASSWORD")
                  }
              }
          """

          if not re.search(r'\bsigningConfigs\s*\{', s):
              pos = android_match.end()
              s = s[:pos] + "\n" + signing + "\n" + s[pos:]

          # Add release signing inside buildTypes.release.
          bt = re.search(r'\bbuildTypes\s*\{', s)
          if not bt:
              raise SystemExit("buildTypes block not found")

          release = re.search(r'\brelease\s*\{', s[bt.end():])
          if not release:
              raise SystemExit("release build type not found")

          pos = bt.end() + release.end()
          if not re.search(r'\bsigningConfig\s+signingConfigs\.release\b', s):
              s = s[:pos] + "\n            signingConfig signingConfigs.release\n" + s[pos:]

          p.write_text(s)
          print("Release signing configured.")
          PY

      - name: Generate Signing Key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Doz, OU=Android, O=Doz, L=Unknown, ST=Unknown, C=US"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Doz-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
